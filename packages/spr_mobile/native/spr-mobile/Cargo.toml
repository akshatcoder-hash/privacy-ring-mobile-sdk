[package]
name = "spr-mobile"
version = "0.1.0"
description = "Flutter-facing bindings for Zolana transaction construction and local proving."
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/helius-labs/zolana-mobile-sdk"
publish = false

[lib]
crate-type = ["lib", "cdylib", "staticlib"]

[features]
# zopro's stage timings in the device log (the Device Farm bench).
zopro-trace = ["zopro-spr/trace"]
default = []
flutter = ["dep:mopro-ffi", "mopro-ffi/flutter"]

[dependencies]
async-trait = "0.1"
flutter_rust_bridge = "=2.11.1"
futures-executor = "0.3"
http = "1"
hex = "0.4"
hmac = "0.12"
bytemuck = "1"
mopro-ffi = { git = "https://github.com/sergeytimoshin/mopro", rev = "c1071f96fa5a28dca8e567dd3944331047450a2b", optional = true }
# Only its types: the wallet sends through the application's transport.
reqwest = { version = "0.12", default-features = false }
reqwest-middleware = "0.4"
# The prover: the request to a witness, the arithmetic (on the GPU where
# there is one), the verified proof in gnark's formats.
zopro-spr = { git = "https://github.com/helius-labs/zk-tools.git", rev = "5f31da99c6ea5b014bf6d2ad8a2979a6da9d324c", features = ["disk-cache"] }
log = "0.4"
num-bigint = "0.4"
serde = { version = "1.0", features = ["derive"] }
solana-account = "4.3"
solana-commitment-config = "3.1"
solana-instruction = "3.4"
solana-message = "4.2"
solana-rpc-client = "4.2"
solana-rpc-client-api = "4.2"
solana-transaction-error = "3.3"
solana-transaction = "4.1"
solana-transaction-status-client-types = "4.1"
serde_json = "1.0"
sha2 = "0.10"
zeroize = "1.9"
solana-address = "=2.6.1"
solana-pubkey = "=4.2.0"
solana-signature = "=3.4.1"
wincode = "=0.5.5"
spr-hasher = { git = "https://github.com/helius-labs/zolana", rev = "ccb395d4b88d8542088a30f47a5d0d7158c3e3b7", features = ["std"] }
spr-interface = { git = "https://github.com/helius-labs/zolana", rev = "ccb395d4b88d8542088a30f47a5d0d7158c3e3b7", features = ["borsh"] }
spr-keypair = { git = "https://github.com/helius-labs/zolana", rev = "ccb395d4b88d8542088a30f47a5d0d7158c3e3b7" }
spr-program = { git = "https://github.com/helius-labs/zolana", rev = "ccb395d4b88d8542088a30f47a5d0d7158c3e3b7" }
spr-api = { git = "https://github.com/helius-labs/zolana", rev = "ccb395d4b88d8542088a30f47a5d0d7158c3e3b7" }
spr-client = { git = "https://github.com/helius-labs/zolana", rev = "ccb395d4b88d8542088a30f47a5d0d7158c3e3b7", features = ["client"] }
spr-transaction = { git = "https://github.com/helius-labs/zolana", rev = "ccb395d4b88d8542088a30f47a5d0d7158c3e3b7" }
spr-user-registry-interface = { git = "https://github.com/helius-labs/zolana", rev = "ccb395d4b88d8542088a30f47a5d0d7158c3e3b7" }

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
zopro-spr = { git = "https://github.com/helius-labs/zk-tools.git", rev = "5f31da99c6ea5b014bf6d2ad8a2979a6da9d324c", features = ["metal"] }

[target.'cfg(target_os = "ios")'.dependencies]
oslog = "0.2"

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.15"
zopro-spr = { git = "https://github.com/helius-labs/zk-tools.git", rev = "5f31da99c6ea5b014bf6d2ad8a2979a6da9d324c", features = ["wgpu"] }

[dev-dependencies]
spr-merkle-tree = { git = "https://github.com/helius-labs/zolana", rev = "ccb395d4b88d8542088a30f47a5d0d7158c3e3b7" }
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
solana-keypair = "3"
solana-signer = "3.0"

[[bin]]
name = "flutter"
path = "src/bin/flutter.rs"
required-features = ["flutter"]

# The frb attribute macro leaves a `cfg(frb_expand)` behind.
[lints.rust.unexpected_cfgs]
check-cfg = ["cfg(frb_expand)"]
level = "warn"
